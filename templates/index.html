<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Predictor</title>
</head>
<body>

    <h1>Student Marks Predictor</h1>

    <form method="POST">
        <input type="number" step="0.1" name="hours" placeholder="Enter study hours" required>
        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <h2>Predicted Marks: {{ prediction }}</h2>
    {% endif %}

</body>
</html>
